<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packages | NK Journeys</title>
  <meta name="description" content="All NK Journeys trip packages with prices.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/nkj.css">
</head>
<body data-page="packages" data-nav="packages.html">
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="wrap">
      <div class="page-h">
        <h1 id="ttl" style="font-size: clamp(32px, 4vw, 48px)">All packages</h1>
        <p id="sub">Every price is per adult. GST is added at checkout.</p>
      </div>
      <div class="bar">
        <div>
          <label for="pq">Search trips</label>
          <input id="pq" placeholder="Search by place or name">
        </div>
        <div>
          <label for="ps">Sort by</label>
          <select id="ps">
            <option value="pop">Popular</option>
            <option value="lo">Price: low to high</option>
            <option value="hi">Price: high to low</option>
            <option value="dur">Shortest first</option>
          </select>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Trip style"></div>
      <p class="mut" id="count" aria-live="polite"></p>
      <div class="grid" id="out"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
